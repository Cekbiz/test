<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Instagram</title>
  <!-- Favicon classic -->
<!--   <link rel="icon" href="/favicon.ico" type="image/x-icon"> -->
  <!-- PNG -->
  <link rel="icon" href="https://img.icons8.com/?size=64&id=bh8L0hocH1mA&format=png" type="image/png">
  <!-- Favicon Apple Devices -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/?size=64&id=bh8L0hocH1mA&format=png">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fafafa;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column; /* Supaya vertikal */
      align-items: center;    /* Tengah secara horizontal */
      gap: 20px;              /* Jarak antar tombol */
    }

    .button, .button2 {
      padding: 15px 30px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      border-radius: 8px;
      transition: background-color 0.3s;
      width: 200px;            /* Biar sama ukurannya */
      text-align: center;
    }

    .button {
      background-color: #E1306C;
    }

    .button:hover {
      background-color: #c92a61;
    }

    .button2 {
      background-color: #007bff;
    }

    .button2:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <a class="button" href="instagram://direct-inbox">Direct Message Instagram</a>
    <a class="button2" id="instaDM" href="#">Buka DM Instagram</a>
  </div>

  <script>
    document.getElementById('instaDM').addEventListener('click', function(e) {
      e.preventDefault();
      const timeout = setTimeout(() => {
        // Fallback jika aplikasi tidak terbuka
        window.location.href = 'https://www.instagram.com/direct/inbox/';
      }, 2000); // tunggu 2 detik

      // Coba buka aplikasi
      window.location.href = 'instagram://direct-inbox';

      // Hentikan fallback jika aplikasi berhasil terbuka
      window.addEventListener('blur', () => {
        clearTimeout(timeout);
      });
    });
  </script>

</body>
</html>
