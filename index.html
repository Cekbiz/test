<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM Instagram</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fafafa;
      font-family: Arial, sans-serif;
    }
    .button {
      margin-bottom: 10px;  /* Jarak antara tombol */
      padding: 15px 30px;
      background-color: #E1306C;
      color: white;
      text-decoration: none;
      font-size: 16px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #c92a61;
    }

    .button2 {
      display: block;       /* Supaya tombol tampil satu per baris */
      margin-top: 10px;  /* Jarak antara tombol */
      padding: 10px 15px;   /* Tambahan biar tombolnya nyaman diklik */
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .button2:hover {
      background-color: #0056b3;
  </style>
</head>
<body>

  <a class="button" href="instagram://direct-inbox">Direct Message Instagram</a>

  <a class="button2" id="instaDM" href="#">Buka DM Instagram</a>

  <script>
    document.getElementById('instaDM').addEventListener('click', function(e) {
      e.preventDefault();
      const timeout = setTimeout(() => {
        // Fallback jika aplikasi tidak terbuka
        window.location.href = 'https://www.instagram.com/direct/inbox/';
      }, 2000); // tunggu 2 detik

      // Coba buka aplikasi
      window.location.href = 'instagram://direct-inbox';

      // Hentikan fallback jika aplikasi berhasil terbuka
      window.addEventListener('blur', () => {
        clearTimeout(timeout);
      });
    });
  </script>

</body>
</html>
